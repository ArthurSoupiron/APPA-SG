# Si tu modifies POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB après un premier démarrage,
# Postgres ne ré-applique pas les vars : `docker compose down -v` puis `up` (données locales effacées).

services:
  postgres:
    image: postgres:18-alpine
    container_name: jaegermyster-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jaegermyster
      POSTGRES_PASSWORD: jaegermyster_dev
      POSTGRES_DB: jaegermyster
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    name: jaegermyster_postgres_data
